name: Speaker CI

on:
  push:
    branches:
      - feat/speaker-water-eject-mvp
    paths:
      - 'apps/speaker/**'
      - '.github/workflows/speaker-ci.yml'
  pull_request:
    paths:
      - 'apps/speaker/**'
      - '.github/workflows/speaker-ci.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/speaker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dokuntag-speaker-debug-apk
          path: apps/speaker/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
