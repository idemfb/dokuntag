name: Speaker CI

on:
  push:
    branches:
      - feat/speaker-water-eject-mvp
    paths:
      - 'apps/speaker/**'
      - '.github/workflows/speaker-ci.yml'
  pull_request:
    paths:
      - 'apps/speaker/**'
      - '.github/workflows/speaker-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/speaker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/speaker/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
